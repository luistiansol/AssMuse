<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Muse Charm Watch</title>
  <style>
    :root {
      --bg: #000000;
      --card: #121622;
      --card-border: #21293d;
      --muse-cream: #ebd8ba;
      --muse-gold: #f5c469;
      --muse-blue: #1877f2;
      --text: #f0f4f8;
      --muted: #828fa3;
      --ok: #00e676;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      text-align: center;
      padding: 18px 14px 45px 14px;
      overflow-x: hidden;
    }

    .sync-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(24, 119, 242, 0.15);
      border: 1px solid rgba(24, 119, 242, 0.4);
      border-radius: 14px;
      padding: 3px 10px;
      font-size: 0.58rem;
      font-weight: 800;
      color: #70b4ff;
      margin-bottom: 6px;
      text-transform: uppercase;
    }

    .sync-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--ok);
      box-shadow: 0 0 6px var(--ok);
    }

    /* AVATAR TOUCH */
    .charm-sensor-wrapper {
      position: relative;
      width: 82px;
      height: 82px;
      margin: 4px auto 8px;
      cursor: pointer;
    }

    .sensor-ring {
      width: 82px;
      height: 82px;
      border-radius: 50%;
      background: radial-gradient(circle at 50% 30%, #fff1d8 0%, #c9ab80 100%);
      border: 2px solid var(--muse-gold);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 16px rgba(245, 196, 105, 0.3);
      transition: transform 0.15s ease;
    }

    .sensor-ring:active {
      transform: scale(0.93);
      border-color: var(--ok);
    }

    .touch-cue {
      position: absolute;
      bottom: -2px;
      right: -2px;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: #141824;
      border: 1.5px solid var(--muse-gold);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.65rem;
    }

    .display-box {
      width: 100%;
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 9px 10px;
      font-size: 0.74rem;
      line-height: 1.35;
      color: var(--text);
      min-height: 48px;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* BOTÓN DIRECTO A LA PÁGINA WEB */
    .web-btn {
      width: 100%;
      background: linear-gradient(135deg, #1877f2, #0d54b3);
      color: #ffffff;
      border: none;
      border-radius: 18px;
      padding: 12px 10px;
      font-size: 0.8rem;
      font-weight: 900;
      cursor: pointer;
      margin-bottom: 8px;
      box-shadow: 0 4px 12px rgba(24, 119, 242, 0.4);
      display: block;
      text-decoration: none;
    }

    .web-btn:active {
      transform: scale(0.96);
    }

    .quick-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      width: 100%;
      margin-bottom: 8px;
    }

    .quick-btn {
      background: var(--card);
      border: 1px solid var(--card-border);
      color: var(--text);
      border-radius: 10px;
      padding: 8px 4px;
      font-size: 0.64rem;
      font-weight: 600;
      cursor: pointer;
    }

    .config-trigger {
      font-size: 0.58rem;
      color: var(--muted);
      text-decoration: underline;
      cursor: pointer;
      margin-top: 4px;
    }

    .config-panel {
      display: none;
      width: 100%;
      background: #0d111a;
      border: 1px solid var(--card-border);
      padding: 8px;
      border-radius: 10px;
      margin-top: 6px;
    }

    .config-panel input {
      width: 100%;
      background: #05070b;
      border: 1px solid var(--card-border);
      color: #fff;
      padding: 6px;
      border-radius: 6px;
      font-size: 0.62rem;
      margin-bottom: 6px;
      text-align: center;
    }

    .config-panel button {
      background: var(--muse-blue);
      border: none;
      color: #fff;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 0.62rem;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="sync-pill" onclick="openMuseWeb()">
    <span class="sync-dot"></span>
    <span>MUSE WEB ACTIVO</span>
  </div>

  <!-- AVATAR / ACCESO DIRECTO -->
  <div class="charm-sensor-wrapper" onclick="openMuseWeb()">
    <div class="sensor-ring" id="sensorRing">
      <svg viewBox="0 0 100 100" width="62" height="62">
        <path d="M22,95 C17,62 26,20 50,20 C74,20 83,62 78,95 Z" fill="#ebd8ba"/>
        <circle cx="34" cy="24" r="7.5" fill="#dec198"/>
        <circle cx="66" cy="24" r="7.5" fill="#dec198"/>
        <circle cx="42" cy="46" r="3" fill="#201a16"/>
        <circle cx="58" cy="46" r="3" fill="#201a16"/>
        <ellipse cx="50" cy="51" rx="2.5" ry="1.5" fill="#694d3b"/>
      </svg>
    </div>
    <div class="touch-cue">↗</div>
  </div>

  <div class="display-box" id="displayBox">
    Toca el botón para abrir la web de tu chat Muse directamente.
  </div>

  <!-- BOTÓN DIRECTO QUE SOLO ABRE LA PÁGINA WEB -->
  <button class="web-btn" onclick="openMuseWeb()">
    ABRIR WEB DE MUSE ↗
  </button>

  <div class="quick-actions">
    <button class="quick-btn" onclick="copyAndOpen('¿Cuáles son mis metas y tareas de hoy en Muse?')">🎯 Ver Metas</button>
    <button class="quick-btn" onclick="copyAndOpen('Estado general de mis agentes y notificaciones')">📋 Resumen</button>
  </div>

  <div class="config-trigger" onclick="toggleConfig()">Editar URL de Destino</div>

  <div class="config-panel" id="configPanel">
    <input type="text" id="targetUrlInput" placeholder="https://muse.ai" value="https://muse.ai">
    <button onclick="saveTargetUrl()">Guardar</button>
  </div>

  <script>
    // URL Web oficial directa
    const DEFAULT_URL = "https://muse.ai";

    function haptic(ms = 35) {
      if (navigator.vibrate) navigator.vibrate(ms);
    }

    function getTargetUrl() {
      return localStorage.getItem('muse_watch_target_url') || DEFAULT_URL;
    }

    // Navegación web pura, sin intents ni Google Play
    function openMuseWeb() {
      haptic(50);
      window.location.href = getTargetUrl();
    }

    function copyAndOpen(promptText) {
      haptic(30);
      if (navigator.clipboard) {
        navigator.clipboard.writeText(promptText).catch(() => {});
      }
      openMuseWeb();
    }

    function toggleConfig() {
      const panel = document.getElementById('configPanel');
      panel.style.display = panel.style.display === 'block' ? 'none' : 'block';
    }

    function saveTargetUrl() {
      const val = document.getElementById('targetUrlInput').value.trim();
      if (val) {
        localStorage.setItem('muse_watch_target_url', val);
        toggleConfig();
        haptic([30, 40]);
        document.getElementById('displayBox').textContent = "URL actualizada. Listo para entrar.";
      }
    }

    // Cargar si ya había una personalizada
    if (localStorage.getItem('muse_watch_target_url')) {
      document.getElementById('targetUrlInput').value = localStorage.getItem('muse_watch_target_url');
    }
  </script>
</body>
</html>
