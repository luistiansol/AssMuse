<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Muse Charm Watch</title>
  <style>
    :root {
      --bg: #000000;
      --card: #141720;
      --card-border: #242938;
      --muse-cream: #ecd8b8;
      --muse-gold: #f5c76c;
      --muse-blue: #2d88ff;
      --muse-glow: rgba(45, 136, 255, 0.35);
      --text: #f0f3f8;
      --muted: #8b95a5;
      --ok: #00e676;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      text-align: center;
      /* Ajuste especial para pantallas circulares de Galaxy Watch */
      padding: 24px 18px 40px 18px;
      overflow-x: hidden;
    }

    /* AVATAR INTERACTIVO */
    .avatar-wrapper {
      position: relative;
      width: 78px;
      height: 78px;
      margin: 6px auto 4px;
      cursor: pointer;
    }

    .avatar-circle {
      width: 78px;
      height: 78px;
      border-radius: 50%;
      background: radial-gradient(circle at 50% 35%, #fff1d8 0%, #d8be98 100%);
      border: 2px solid var(--muse-gold);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 15px var(--muse-glow);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    /* Estados del Avatar */
    .avatar-circle.listening {
      animation: pulse-listen 1.4s infinite alternate;
      border-color: #00e676;
    }

    .avatar-circle.speaking {
      animation: pulse-speak 0.7s infinite alternate;
      border-color: var(--muse-blue);
    }

    @keyframes pulse-listen {
      0% { transform: scale(1); box-shadow: 0 0 10px rgba(0, 230, 118, 0.4); }
      100% { transform: scale(1.08); box-shadow: 0 0 25px rgba(0, 230, 118, 0.8); }
    }

    @keyframes pulse-speak {
      0% { transform: scale(1); box-shadow: 0 0 10px var(--muse-blue); }
      100% { transform: scale(1.06); box-shadow: 0 0 22px var(--muse-blue); }
    }

    /* Ojos animados */
    .eye {
      transform-origin: center;
      animation: blink 4s infinite ease-in-out;
    }

    @keyframes blink {
      0%, 94%, 100% { transform: scaleY(1); }
      96% { transform: scaleY(0.1); }
    }

    .muse-corner-badge {
      position: absolute;
      bottom: -2px;
      right: -2px;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: #1c202a;
      border: 1.5px solid var(--muse-gold);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .muse-corner-badge span {
      font-family: Georgia, serif;
      font-style: italic;
      font-weight: 900;
      font-size: 0.85rem;
      color: var(--muse-gold);
    }

    .status-text {
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 6px;
    }

    /* CAJA DE DIÁLOGO / RESPUESTA DE LA IA */
    .ai-bubble {
      width: 100%;
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 9px 10px;
      font-size: 0.75rem;
      line-height: 1.35;
      color: var(--text);
      min-height: 48px;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    /* BOTÓN PRINCIPAL HABLÁR/ESCUCHAR */
    .action-btn {
      width: 100%;
      background: linear-gradient(135deg, #f7ecd7, var(--muse-cream));
      color: #171920;
      border: none;
      border-radius: 20px;
      padding: 10px 12px;
      font-size: 0.8rem;
      font-weight: 900;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      cursor: pointer;
      margin-bottom: 8px;
    }

    .action-btn:active { transform: scale(0.96); }

    .action-btn.active {
      background: #00e676;
      color: #000;
    }

    /* ACCIONES RÁPIDAS EN GRID COMPACTO */
    .quick-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 5px;
      width: 100%;
      margin-bottom: 8px;
    }

    .quick-btn {
      background: var(--card);
      border: 1px solid var(--card-border);
      color: var(--text);
      border-radius: 10px;
      padding: 7px 4px;
      font-size: 0.64rem;
      font-weight: 600;
      cursor: pointer;
    }

    .quick-btn:active { background: #202636; }

    /* PANEL CONFIG / API KEY */
    .drawer {
      font-size: 0.6rem;
      color: var(--muted);
      margin-top: 4px;
      text-decoration: underline;
      cursor: pointer;
    }

    .config-panel {
      display: none;
      width: 100%;
      background: #11141d;
      border: 1px solid var(--card-border);
      padding: 8px;
      border-radius: 12px;
      margin-top: 6px;
    }

    .config-panel input {
      width: 100%;
      background: #090a0f;
      border: 1px solid var(--card-border);
      color: #fff;
      padding: 5px;
      border-radius: 6px;
      font-size: 0.65rem;
      margin-bottom: 5px;
      text-align: center;
    }

    .config-panel button {
      background: var(--muse-blue);
      border: none;
      color: #fff;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 0.62rem;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <!-- AVATAR TIPO MUSE CHARM -->
  <div class="avatar-wrapper" onclick="toggleListening()">
    <div class="avatar-circle" id="museAvatar">
      <svg viewBox="0 0 100 100" width="70" height="70">
        <!-- Cuerpo esponjoso del personaje -->
        <path d="M20,95 C15,60 25,18 50,18 C75,18 85,60 80,95 Z" fill="#ecd8b8"/>
        <!-- Orejitas / detalles -->
        <circle cx="33" cy="24" r="8" fill="#dfc49c"/>
        <circle cx="67" cy="24" r="8" fill="#dfc49c"/>
        <circle cx="33" cy="24" r="5" fill="#f7ecd7"/>
        <circle cx="67" cy="24" r="5" fill="#f7ecd7"/>
        <!-- Ojos con parpadeo -->
        <g class="eye">
          <circle cx="41" cy="45" r="3.2" fill="#201a16"/>
          <circle cx="42" cy="44" r="1" fill="#ffffff"/>
        </g>
        <g class="eye">
          <circle cx="59" cy="45" r="3.2" fill="#201a16"/>
          <circle cx="60" cy="44" r="1" fill="#ffffff"/>
        </g>
        <!-- Hocico / Nariz -->
        <ellipse cx="50" cy="50" rx="2.5" ry="1.6" fill="#694d3b"/>
        <!-- Sonrisa sutil -->
        <path d="M47,53 Q50,56 53,53" fill="none" stroke="#694d3b" stroke-width="1.2" stroke-linecap="round"/>
      </svg>
    </div>
    <div class="muse-corner-badge"><span>m</span></div>
  </div>

  <div class="status-text" id="statusLabel">Toca para hablar</div>

  <!-- BUBBLE DE RESPUESTA -->
  <div class="ai-bubble" id="aiOutput">
    "Hola, estoy aquí en tu muñeca. ¿Qué necesitas lograr hoy?"
  </div>

  <!-- BOTÓN DE VOZ -->
  <button class="action-btn" id="micBtn" onclick="toggleListening()">
    <span id="micIcon">🎙️</span>
    <span id="micText">ESCUCHAR</span>
  </button>

  <!-- ACCIONES RÁPIDAS -->
  <div class="quick-grid">
    <button class="quick-btn" onclick="sendQuickPrompt('Dame un consejo motivador y breve para mi día.')">⚡ Motívame</button>
    <button class="quick-btn" onclick="sendQuickPrompt('¿Cuál es mi siguiente enfoque o hábito clave de hoy?')">🎯 Siguiente paso</button>
    <button class="quick-btn" onclick="sendQuickPrompt('Respóndeme en una frase: ¿cómo mantengo la calma ahora?')">🧘 Calma 1 min</button>
    <button class="quick-btn" onclick="clearConversation()">🧹 Limpiar</button>
  </div>

  <div class="drawer" onclick="toggleConfig()">Configuración IA</div>

  <div class="config-panel" id="configPanel">
    <input type="password" id="apiKeyInput" placeholder="API Key (Groq / OpenAI)">
    <input type="text" id="endpointInput" placeholder="URL Base (Ej: https://api.groq.com/openai/v1)" value="https://api.groq.com/openai/v1">
    <input type="text" id="modelInput" placeholder="Modelo (Ej: llama-3.1-8b-instant)" value="llama-3.1-8b-instant">
    <button onclick="saveConfig()">Guardar</button>
  </div>

  <script>
    const avatar = document.getElementById('museAvatar');
    const statusLabel = document.getElementById('statusLabel');
    const aiOutput = document.getElementById('aiOutput');
    const micBtn = document.getElementById('micBtn');
    const micText = document.getElementById('micText');

    let isListening = false;
    let recognition = null;

    // Vibración adaptativa para Galaxy Watch
    function haptic(ms = 35) {
      if (navigator.vibrate) navigator.vibrate(ms);
    }

    // Inicializar Voz (Speech Recognition)
    if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      recognition = new SpeechRecognition();
      recognition.lang = 'es-ES';
      recognition.continuous = false;
      recognition.interimResults = false;

      recognition.onstart = () => {
        isListening = true;
        haptic([40, 30, 40]);
        avatar.className = 'avatar-circle listening';
        micBtn.classList.add('active');
        micText.textContent = "ESCUCHANDO...";
        statusLabel.textContent = "Te escucho atentamente...";
      };

      recognition.onresult = (event) => {
        const transcript = event.results[0][0].transcript;
        processUserMessage(transcript);
      };

      recognition.onerror = () => {
        resetUIAfterSpeech();
        statusLabel.textContent = "No entendí, reintenta";
      };

      recognition.onend = () => {
        resetUIAfterSpeech();
      };
    } else {
      micBtn.style.display = 'none';
      statusLabel.textContent = "Voz no soportada (Usa botones)";
    }

    function toggleListening() {
      if (!recognition) return;
      if (isListening) {
        recognition.stop();
      } else {
        window.speechSynthesis.cancel();
        try {
          recognition.start();
        } catch(e) {
          recognition.stop();
        }
      }
    }

    function resetUIAfterSpeech() {
      isListening = false;
      avatar.className = 'avatar-circle';
      micBtn.classList.remove('active');
      micText.textContent = "ESCUCHAR";
      statusLabel.textContent = "Toca para hablar";
    }

    // Respuestas por voz del reloj (Text-To-Speech)
    function speakText(text) {
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();

      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'es-ES';
      utterance.rate = 1.05; // Ritmo ágil para el reloj
      utterance.pitch = 1.1; // Tono ligeramente simpático/Muse

      utterance.onstart = () => {
        avatar.className = 'avatar-circle speaking';
        statusLabel.textContent = "Muse hablando...";
      };

      utterance.onend = () => {
        avatar.className = 'avatar-circle';
        statusLabel.textContent = "Listo";
      };

      window.speechSynthesis.speak(utterance);
    }

    // NÚCLEO DE INTELIGENCIA ARTIFICIAL
    async function processUserMessage(userText) {
      haptic(50);
      statusLabel.textContent = "Pensando...";
      aiOutput.textContent = `"${userText}"`;

      const apiKey = localStorage.getItem('muse_api_key');
      const endpoint = localStorage.getItem('muse_endpoint') || 'https://api.groq.com/openai/v1';
      const model = localStorage.getItem('muse_model') || 'llama-3.1-8b-instant';

      // 1. SI TIENE API CONFIGURADA: Conexión Real con LLM
      if (apiKey) {
        try {
          const res = await fetch(`${endpoint}/chat/completions`, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': `Bearer ${apiKey}`
            },
            body: JSON.stringify({
              model: model,
              messages: [
                {
                  role: "system",
                  content: "Eres Muse, un agente de IA empático, perspicaz y minimalista integrado en un reloj inteligente Samsung Watch. Tus respuestas NUNCA deben exceder 2 frases cortas. Sé directo, cálido y enfocado en la acción."
                },
                { role: "user", content: userText }
              ],
              max_tokens: 60,
              temperature: 0.7
            })
          });

          const data = await res.json();
          if (data.choices && data.choices[0]) {
            const reply = data.choices[0].message.content.trim();
            aiOutput.textContent = reply;
            speakText(reply);
            return;
          }
        } catch (err) {
          console.error(err);
        }
      }

      // 2. MODO FALLBACK (Si no hay API o falla internet)
      setTimeout(() => {
        const fallbackAnswers = [
          "Recuerda tu meta principal: respira y da el siguiente paso.",
          "Todo en orden. Estoy monitorizando tu día desde tu muñeca.",
          "Excelente momento para enfocarte 20 minutos sin distracciones.",
          "Estoy lista cuando me necesites. Toca el botón para hablar."
        ];
        const randomReply = fallbackAnswers[Math.floor(Math.random() * fallbackAnswers.length)];
        aiOutput.textContent = randomReply;
        speakText(randomReply);
      }, 500);
    }

    function sendQuickPrompt(prompt) {
      processUserMessage(prompt);
    }

    function clearConversation() {
      haptic(20);
      window.speechSynthesis.cancel();
      aiOutput.textContent = "¿En qué te concentrarás ahora?";
      statusLabel.textContent = "Toca para hablar";
    }

    function toggleConfig() {
      const panel = document.getElementById('configPanel');
      panel.style.display = panel.style.display === 'block' ? 'none' : 'block';
    }

    function saveConfig() {
      const key = document.getElementById('apiKeyInput').value.trim();
      const endpoint = document.getElementById('endpointInput').value.trim();
      const model = document.getElementById('modelInput').value.trim();
      if (key) localStorage.setItem('muse_api_key', key);
      if (endpoint) localStorage.setItem('muse_endpoint', endpoint);
      if (model) localStorage.setItem('muse_model', model);
      toggleConfig();
      haptic([30, 40]);
      aiOutput.textContent = "Configuración de IA guardada.";
    }

    // Cargar config guardada
    if (localStorage.getItem('muse_api_key')) {
      document.getElementById('apiKeyInput').value = localStorage.getItem('muse_api_key');
    }
  </script>
</body>
</html>
