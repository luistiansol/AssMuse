<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Muse Charm Watch Monitor</title>
  <style>
    :root {
      --bg: #000000;
      --card: #11151f;
      --card-border: #1f2738;
      --muse-cream: #ebd8ba;
      --muse-gold: #f5c469;
      --muse-blue: #1877f2;
      --text: #f0f4f8;
      --muted: #828fa3;
      --ok: #00e676;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      text-align: center;
      padding: 16px 14px 40px 14px;
      overflow-x: hidden;
    }

    /* ESTADO DEL AGENTE EN LA NUBE */
    .sync-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(24, 119, 242, 0.15);
      border: 1px solid rgba(24, 119, 242, 0.4);
      border-radius: 14px;
      padding: 3px 10px;
      font-size: 0.58rem;
      font-weight: 800;
      color: #70b4ff;
      margin-bottom: 4px;
      text-transform: uppercase;
    }

    .sync-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--ok);
      box-shadow: 0 0 6px var(--ok);
      animation: pulse 2s infinite alternate;
    }

    @keyframes pulse {
      0% { opacity: 0.4; }
      100% { opacity: 1; }
    }

    /* SENSOR BIOMÉTRICO / AVATAR INTERACTIVO */
    .charm-sensor-wrapper {
      position: relative;
      width: 82px;
      height: 82px;
      margin: 4px auto 6px;
      cursor: pointer;
    }

    .sensor-ring {
      width: 82px;
      height: 82px;
      border-radius: 50%;
      background: radial-gradient(circle at 50% 30%, #fff1d8 0%, #c9ab80 100%);
      border: 2px solid var(--muse-gold);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 16px rgba(245, 196, 105, 0.3);
      transition: all 0.2s ease;
    }

    .sensor-ring:active {
      transform: scale(0.94);
      box-shadow: 0 0 25px var(--ok);
      border-color: var(--ok);
    }

    .sensor-ring.speaking {
      animation: speak-glow 0.6s infinite alternate;
      border-color: var(--muse-blue);
    }

    @keyframes speak-glow {
      0% { box-shadow: 0 0 10px var(--muse-blue); }
      100% { box-shadow: 0 0 22px var(--muse-blue); }
    }

    .touch-cue {
      position: absolute;
      bottom: -3px;
      right: -3px;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: #141824;
      border: 1.5px solid var(--muse-gold);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.65rem;
    }

    /* PANEL DE MONITOREO DE CONECTORES */
    .connector-row {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 4px;
      width: 100%;
      margin-bottom: 8px;
    }

    .connector-card {
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 5px 2px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
    }

    .connector-card span.name {
      font-size: 0.52rem;
      color: var(--muted);
      font-weight: bold;
    }

    .connector-card span.status {
      font-size: 0.58rem;
      color: var(--ok);
      font-weight: 800;
    }

    /* PANTALLA PRINCIPAL DE ESTADO */
    .display-box {
      width: 100%;
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 8px 10px;
      font-size: 0.72rem;
      line-height: 1.3;
      color: var(--text);
      min-height: 48px;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* BOTÓN DE ACCESO DIRECTO A LA SESIÓN VIVA */
    .live-session-btn {
      width: 100%;
      background: linear-gradient(135deg, #1877f2, #0d54b3);
      color: #ffffff;
      border: none;
      border-radius: 18px;
      padding: 10px 12px;
      font-size: 0.76rem;
      font-weight: 900;
      letter-spacing: 0.4px;
      cursor: pointer;
      margin-bottom: 8px;
      box-shadow: 0 4px 12px rgba(24, 119, 242, 0.4);
    }

    .live-session-btn:active {
      transform: scale(0.96);
    }

    .quick-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 5px;
      width: 100%;
      margin-bottom: 8px;
    }

    .quick-btn {
      background: var(--card);
      border: 1px solid var(--card-border);
      color: var(--text);
      border-radius: 10px;
      padding: 7px 4px;
      font-size: 0.62rem;
      font-weight: 600;
      cursor: pointer;
    }

    .config-trigger {
      font-size: 0.58rem;
      color: var(--muted);
      text-decoration: underline;
      cursor: pointer;
    }

    .config-panel {
      display: none;
      width: 100%;
      background: #0d111a;
      border: 1px solid var(--card-border);
      padding: 8px;
      border-radius: 10px;
      margin-top: 6px;
    }

    .config-panel input {
      width: 100%;
      background: #05070b;
      border: 1px solid var(--card-border);
      color: #fff;
      padding: 6px;
      border-radius: 6px;
      font-size: 0.62rem;
      margin-bottom: 6px;
      text-align: center;
    }

    .config-panel button {
      background: var(--muse-blue);
      border: none;
      color: #fff;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 0.62rem;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <!-- INDICADOR DE ENLACE NUBE MUSE -->
  <div class="sync-pill" onclick="syncLiveStatus()">
    <span class="sync-dot"></span>
    <span id="syncStatus">MUSE ENLACE VIVO</span>
  </div>

  <!-- SENSOR BIOMÉTRICO (ESTILO MUSE CHARM) -->
  <div class="charm-sensor-wrapper" onclick="triggerCharmTouch()">
    <div class="sensor-ring" id="sensorRing">
      <svg viewBox="0 0 100 100" width="62" height="62">
        <path d="M22,95 C17,62 26,20 50,20 C74,20 83,62 78,95 Z" fill="#ebd8ba"/>
        <circle cx="34" cy="24" r="7.5" fill="#dec198"/>
        <circle cx="66" cy="24" r="7.5" fill="#dec198"/>
        <circle cx="42" cy="46" r="3" fill="#201a16"/>
        <circle cx="58" cy="46" r="3" fill="#201a16"/>
        <ellipse cx="50" cy="51" rx="2.5" ry="1.5" fill="#694d3b"/>
      </svg>
    </div>
    <div class="touch-cue">👆</div>
  </div>

  <!-- MONITOR DE SERVICIOS ACTIVOS (NOTION / GITHUB / CALENDARIO) -->
  <div class="connector-row">
    <div class="connector-card">
      <span class="name">NOTION</span>
      <span class="status">SINCRONIZADO</span>
    </div>
    <div class="connector-card">
      <span class="name">GITHUB</span>
      <span class="status">ACTIVO</span>
    </div>
    <div class="connector-card">
      <span class="name">METAS</span>
      <span class="status" id="goalsStatus">AL DÍA</span>
    </div>
  </div>

  <!-- MONITOR DE MENSAJES Y RESPUESTAS -->
  <div class="display-box" id="displayBox">
    "Listo en tu muñeca. Toca el sensor para hablar o abre tu sesión completa."
  </div>

  <!-- BOTÓN DIRECTO AL NAVEGADOR DE TU CUENTA -->
  <button class="live-session-btn" onclick="openLiveMuseChat()">
    ENTRAR A MI CHAT DE MUSE ↗
  </button>

  <!-- ACCIONES RÁPIDAS -->
  <div class="quick-actions">
    <button class="quick-btn" onclick="readStatusVoice()">🔊 Resumen del día</button>
    <button class="quick-btn" onclick="askQuickPrompt('¿Tengo tareas o aprobaciones pendientes en mi cuenta?')">📋 Pendientes</button>
  </div>

  <div class="config-trigger" onclick="toggleConfig()">Vincular URL de tu Chat</div>

  <div class="config-panel" id="configPanel">
    <input type="text" id="chatUrlInput" placeholder="URL directa de tu chat (https://www.meta.ai/c/...)">
    <button onclick="saveChatUrl()">Guardar Enlace</button>
  </div>

  <script>
    const sensorRing = document.getElementById('sensorRing');
    const displayBox = document.getElementById('displayBox');
    const syncStatus = document.getElementById('syncStatus');
    let latinVoice = null;

    // Obtener la URL guardada del chat o usar la raíz de Meta AI
    function getMuseUrl() {
      return localStorage.getItem('muse_live_url') || 'https://www.meta.ai/';
    }

    function haptic(ms = 40) {
      if (navigator.vibrate) navigator.vibrate(ms);
    }

    /* FILTRO DE VOZ: ESPAÑOL LATINOAMERICANO PURO */
    function initLatinVoice() {
      if (!('speechSynthesis' in window)) return;
      const voices = window.speechSynthesis.getVoices();
      const preferred = ['es-419', 'es-NI', 'es-MX', 'es-US', 'es-CO', 'es-CR'];
      
      latinVoice = voices.find(v => 
        preferred.some(code => v.lang.toLowerCase().replace('_', '-').includes(code.toLowerCase()))
      ) || voices.find(v => 
        v.lang.toLowerCase().startsWith('es') && !v.lang.toLowerCase().includes('es-es')
      ) || voices.find(v => v.lang.toLowerCase().startsWith('es'));
    }

    if ('speechSynthesis' in window) {
      window.speechSynthesis.onvoiceschanged = initLatinVoice;
      initLatinVoice();
    }

    function speakLatin(text) {
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();

      const utterance = new SpeechSynthesisUtterance(text);
      if (latinVoice) {
        utterance.voice = latinVoice;
        utterance.lang = latinVoice.lang;
      } else {
        utterance.lang = 'es-419';
      }
      utterance.rate = 1.0;
      utterance.pitch = 1.05;

      utterance.onstart = () => sensorRing.classList.add('speaking');
      utterance.onend = () => sensorRing.classList.remove('speaking');

      window.speechSynthesis.speak(utterance);
    }

    /* TOQUE EN EL SENSOR DEL CHARM: HABLAR AL AGENTE */
    function triggerCharmTouch() {
      haptic([50, 30, 50]);
      
      if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        const recog = new SpeechRecognition();
        recog.lang = 'es-419';
        recog.continuous = false;

        recog.onstart = () => {
          displayBox.textContent = "Escuchando tu comando...";
          syncStatus.textContent = "RECIBIENDO AUDIO";
        };

        recog.onresult = (e) => {
          const text = e.results[0][0].transcript;
          displayBox.textContent = `"${text}"`;
          haptic(60);
          
          // Copiar al portapapeles y transferir al navegador web autenticado
          if (navigator.clipboard) {
            navigator.clipboard.writeText(text).catch(() => {});
          }
          
          speakLatin("Comando listo. Abriendo tu asistente.");
          setTimeout(() => {
            window.location.href = getMuseUrl();
          }, 900);
        };

        recog.onerror = () => {
          displayBox.textContent = "No alcancé a escucharte bien.";
          syncStatus.textContent = "MUSE ENLACE VIVO";
        };

        recog.start();
      } else {
        openLiveMuseChat();
      }
    }

    /* ABRIR EL CHAT EN VIVO DE TU CUENTA */
    function openLiveMuseChat() {
      haptic(50);
      window.location.href = getMuseUrl();
    }

    function readStatusVoice() {
      const msg = "Tus conectores de Notion y GitHub están enlazados. No hay aprobaciones urgentes.";
      displayBox.textContent = msg;
      speakLatin(msg);
    }

    function askQuickPrompt(prompt) {
      haptic(30);
      displayBox.textContent = `Consultando: ${prompt}`;
      if (navigator.clipboard) {
        navigator.clipboard.writeText(prompt).catch(() => {});
      }
      setTimeout(() => {
        window.location.href = getMuseUrl();
      }, 600);
    }

    function syncLiveStatus() {
      haptic(25);
      syncStatus.textContent = "SINCRONIZANDO...";
      setTimeout(() => {
        syncStatus.textContent = "MUSE ENLACE VIVO";
        displayBox.textContent = "Cuenta verificada y activa.";
      }, 500);
    }

    function toggleConfig() {
      const panel = document.getElementById('configPanel');
      panel.style.display = panel.style.display === 'block' ? 'none' : 'block';
    }

    function saveChatUrl() {
      const val = document.getElementById('chatUrlInput').value.trim();
      if (val) {
        localStorage.setItem('muse_live_url', val);
        toggleConfig();
        haptic([30, 40]);
        displayBox.textContent = "URL de tu chat vinculada correctamente.";
      }
    }

    // Inicializar URL guardada
    if (localStorage.getItem('muse_live_url')) {
      document.getElementById('chatUrlInput').value = localStorage.getItem('muse_live_url');
    }
  </script>
</body>
</html>
