<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Kaly Muse Watch Safe-Frame</title>
  <style>
    :root {
      --bg: #000000;
      --card: #131722;
      --card-border: #232c3f;
      --gold: #f5c469;
      --blue: #1877f2;
      --ok: #00e676;
      --text: #ffffff;
      --muted: #8b97a8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    /* AJUSTE CIRCULAR OBLIGATORIO PARA GALAXY / TIZEN WATCH */
    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      /* Margen seguro: 65px abajo para despejar el micrófono de la curvatura */
      padding: 12px 14px 62px 14px;
    }

    /* CABECERA VINCULADA CON KALY */
    .assistant-header {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 4px;
      background: #141824;
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 3px 10px;
    }

    .dog-avatar {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: #ecd8ba;
      border: 1.5px solid var(--gold);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.75rem;
    }

    .assistant-title {
      font-size: 0.65rem;
      font-weight: 800;
      color: var(--gold);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* PANTALLA DE ESTADO COMPACTA */
    .status-card {
      width: 90%;
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 10px 8px;
      text-align: center;
      font-size: 0.72rem;
      line-height: 1.3;
      color: var(--text);
      box-shadow: 0 4px 15px rgba(0,0,0,0.6);
    }

    /* BOTÓN GIGANTE DE MICRÓFONO PARA EL PULGAR */
    .giant-mic-btn {
      width: 68px;
      height: 68px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #2384ff 0%, #0d4fa8 100%);
      border: 2px solid #5ca5ff;
      color: #fff;
      font-size: 1.6rem;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 20px rgba(24, 119, 242, 0.5);
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      margin-top: 2px;
    }

    .giant-mic-btn:active {
      transform: scale(0.92);
      box-shadow: 0 0 25px var(--ok);
      border-color: var(--ok);
    }

    .giant-mic-btn.listening {
      animation: mic-pulse 1.2s infinite alternate;
      border-color: var(--ok);
      background: radial-gradient(circle at 35% 35%, #00e676 0%, #00994c 100%);
    }

    @keyframes mic-pulse {
      0% { transform: scale(0.96); box-shadow: 0 0 10px rgba(0, 230, 118, 0.4); }
      100% { transform: scale(1.08); box-shadow: 0 0 28px rgba(0, 230, 118, 0.9); }
    }

    /* BARRA INFERIOR SEGURA (FUERA DEL CORTE REDONDO) */
    .bottom-bar {
      display: flex;
      gap: 6px;
      width: 88%;
      justify-content: center;
    }

    .nav-btn {
      flex: 1;
      background: var(--card);
      border: 1px solid var(--card-border);
      color: var(--text);
      border-radius: 12px;
      padding: 8px 4px;
      font-size: 0.62rem;
      font-weight: 800;
      cursor: pointer;
    }

    .nav-btn:active {
      background: #1c2438;
      transform: scale(0.95);
    }
  </style>
</head>
<body>

  <!-- CABECERA DE TU ASISTENTE -->
  <div class="assistant-header">
    <div class="dog-avatar">🐶</div>
    <span class="assistant-title">Kaly · Muse</span>
  </div>

  <!-- ESTADO / COMANDO -->
  <div class="status-card" id="statusBox">
    Toca el botón azul para dictarle a Kaly sin tocar el borde.
  </div>

  <!-- BOTÓN DE MICRÓFONO GRANDE Y CENTRADO -->
  <div class="giant-mic-btn" id="micBtn" onclick="listenToVoice()">
    🎙️
  </div>

  <!-- BOTONES ELEVADOS FUERA DE LA CURVATURA INFERIOR -->
  <div class="bottom-bar">
    <button class="nav-btn" onclick="openFullMuseChat()">
      ↗ Ver Chat Completo
    </button>
  </div>

  <script>
    const statusBox = document.getElementById('statusBox');
    const micBtn = document.getElementById('micBtn');

    function haptic(ms = 40) {
      if (navigator.vibrate) navigator.vibrate(ms);
    }

    /* RECONOCIMIENTO DE VOZ FÁCIL */
    function listenToVoice() {
      haptic(50);

      if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
        const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
        const rec = new SpeechRec();
        rec.lang = 'es-419'; // Español latino neutro

        rec.onstart = () => {
          micBtn.classList.add('listening');
          statusBox.textContent = "Te escucho... habla ahora.";
        };

        rec.onresult = (e) => {
          micBtn.classList.remove('listening');
          const query = e.results[0][0].transcript;
          statusBox.textContent = `"${query}"`;
          haptic([40, 50]);

          // Copiar el texto al portapapeles para pegarlo en un toque
          if (navigator.clipboard) {
            navigator.clipboard.writeText(query).catch(() => {});
          }

          statusBox.textContent = "Copiado. Abriendo a Kaly...";
          setTimeout(() => {
            openFullMuseChat();
          }, 800);
        };

        rec.onerror = () => {
          micBtn.classList.remove('listening');
          statusBox.textContent = "No alcancé a oírte. Reintenta.";
        };

        rec.start();
      } else {
        openFullMuseChat();
      }
    }

    /* ABRIR DIRECTAMENTE EL CHAT DE KALY */
    function openFullMuseChat() {
      haptic(35);
      // Abre tu sesión web activa
      window.location.href = "https://muse.ai";
    }
  </script>
</body>
</html>
