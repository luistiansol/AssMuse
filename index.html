<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <!-- Viewport estricto para evitar zoom accidental en el reloj -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Muse Charm Watch</title>
  <style>
    :root {
      --bg: #000000;
      --gold: #f5c469;
      --gold-glow: rgba(245, 196, 105, 0.35);
      --cream: #ebd8ba;
      --blue: #1877f2;
      --card: #12151e;
      --text: #f0f4f8;
      --muted: #828fa3;
      --ok: #00e676;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    /* FORMATO REDONDO EXACTO PARA GALAXY / TIZEN WATCH */
    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      /* Margen seguro para que la pantalla redonda no corte los bordes */
      padding: 8vh 6vw 7vh 6vw;
      border-radius: 50%;
    }

    /* ENCABEZADO MINIMALISTA CIRCULAR */
    .top-status {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 0.62rem;
      font-weight: 800;
      letter-spacing: 0.8px;
      color: var(--gold);
      text-transform: uppercase;
      margin-top: 2px;
    }

    .live-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--ok);
      box-shadow: 0 0 6px var(--ok);
      animation: pulse-dot 2s infinite alternate;
    }

    @keyframes pulse-dot {
      0% { opacity: 0.3; transform: scale(0.8); }
      100% { opacity: 1; transform: scale(1.2); }
    }

    /* MASCOTA CHARM CENTRAL CON FÍSICAS */
    .charm-stage {
      position: relative;
      width: 36vw;
      max-width: 140px;
      aspect-ratio: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .charm-body {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: radial-gradient(circle at 50% 30%, #fff4df 0%, #d1b48b 100%);
      border: 2px solid var(--gold);
      box-shadow: 0 0 18px var(--gold-glow);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.15s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    /* Reacción al tocar (efecto squish) */
    .charm-body:active, .charm-body.tapped {
      transform: scale(0.90) scaleY(0.85);
      box-shadow: 0 0 25px var(--ok);
      border-color: var(--ok);
    }

    .charm-body.speaking {
      animation: speak-pulse 0.7s infinite alternate ease-in-out;
      border-color: var(--blue);
    }

    @keyframes speak-pulse {
      0% { transform: scale(0.98); box-shadow: 0 0 12px var(--blue); }
      100% { transform: scale(1.06); box-shadow: 0 0 24px var(--blue); }
    }

    /* Ojos parpadeantes */
    .eye {
      transform-origin: center;
      animation: blink 4s infinite ease-in-out;
    }

    @keyframes blink {
      0%, 94%, 100% { transform: scaleY(1); }
      96% { transform: scaleY(0.1); }
    }

    /* Orejitas con balanceo */
    .ear {
      animation: ear-wiggle 6s infinite ease-in-out;
      transform-origin: bottom center;
    }

    @keyframes ear-wiggle {
      0%, 90%, 100% { transform: rotate(0deg); }
      93% { transform: rotate(-6deg); }
      96% { transform: rotate(6deg); }
    }

    /* BURBUJA DE DIÁLOGO DINÁMICA ULTRA-COMPACTA */
    .dialog-pill {
      width: 84%;
      background: var(--card);
      border: 1px solid #1f2638;
      border-radius: 14px;
      padding: 6px 10px;
      font-size: 0.68rem;
      line-height: 1.25;
      color: var(--text);
      text-align: center;
      min-height: 38px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.5);
    }

    /* CONTROLES CURVADOS INFERIORES */
    .bottom-dock {
      display: flex;
      width: 82%;
      gap: 6px;
      justify-content: center;
      margin-bottom: 2px;
    }

    .dock-btn {
      flex: 1;
      background: var(--card);
      border: 1px solid #232c40;
      color: var(--text);
      border-radius: 16px;
      padding: 9px 4px;
      font-size: 0.65rem;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      cursor: pointer;
    }

    .dock-btn:active {
      background: #1c2438;
      transform: scale(0.94);
    }

    .dock-btn.primary {
      background: linear-gradient(135deg, var(--blue), #0b55b8);
      border: none;
      color: #ffffff;
      flex: 1.3;
      box-shadow: 0 3px 10px rgba(24, 119, 242, 0.4);
    }
  </style>
</head>
<body>

  <!-- ESTADO DEL CHARM EN LA PARTE SUPERIOR -->
  <div class="top-status">
    <span class="live-dot"></span>
    <span id="statusLabel">MUSE CHARM</span>
  </div>

  <!-- MASCOTA CHARM INTERACTIVA -->
  <div class="charm-stage" onclick="pokeCharm()">
    <div class="charm-body" id="charmBody">
      <svg viewBox="0 0 100 100" width="80%" height="80%">
        <!-- Orejas con animación -->
        <g class="ear">
          <circle cx="32" cy="22" r="8" fill="#d4b488"/>
          <circle cx="32" cy="22" r="5" fill="#fcecd2"/>
        </g>
        <g class="ear">
          <circle cx="68" cy="22" r="8" fill="#d4b488"/>
          <circle cx="68" cy="22" r="5" fill="#fcecd2"/>
        </g>
        <!-- Cuerpo esponjoso -->
        <path d="M20,95 C15,60 25,18 50,18 C75,18 85,60 80,95 Z" fill="#ebd8ba"/>
        <!-- Ojos con parpadeo -->
        <g class="eye">
          <circle cx="41" cy="45" r="3.2" fill="#1e1814"/>
          <circle cx="42" cy="44" r="1.1" fill="#ffffff"/>
        </g>
        <g class="eye">
          <circle cx="59" cy="45" r="3.2" fill="#1e1814"/>
          <circle cx="60" cy="44" r="1.1" fill="#ffffff"/>
        </g>
        <!-- Nariz / Hocico -->
        <ellipse cx="50" cy="51" rx="2.5" ry="1.6" fill="#694d3b"/>
        <!-- Sonrisa sutil -->
        <path d="M47,54 Q50,57 53,54" fill="none" stroke="#694d3b" stroke-width="1.2" stroke-linecap="round"/>
      </svg>
    </div>
  </div>

  <!-- BURBUJA DE MENSAJE -->
  <div class="dialog-pill" id="dialogText">
    Tocame para hablar o entra al chat web.
  </div>

  <!-- BOTONES CURVADOS PARA EL PULGAR -->
  <div class="bottom-dock">
    <button class="dock-btn" onclick="listenCharmVoice()">
      <span>🎙️</span> Hablar
    </button>
    <button class="dock-btn primary" onclick="goToMuseWeb()">
      <span>🌐</span> Abrir Web
    </button>
  </div>

  <script>
    const charmBody = document.getElementById('charmBody');
    const dialogText = document.getElementById('dialogText');
    const statusLabel = document.getElementById('statusLabel');
    let latinVoice = null;

    // Vibración corta para simular contacto físico
    function haptic(ms = 35) {
      if (navigator.vibrate) navigator.vibrate(ms);
    }

    /* FILTRO DE VOZ: ESPAÑOL LATINOAMERICANO */
    function setupLatinAudio() {
      if (!('speechSynthesis' in window)) return;
      const voices = window.speechSynthesis.getVoices();
      const preferred = ['es-419', 'es-NI', 'es-MX', 'es-US', 'es-CO'];
      latinVoice = voices.find(v => 
        preferred.some(code => v.lang.toLowerCase().replace('_', '-').includes(code.toLowerCase()))
      ) || voices.find(v => 
        v.lang.toLowerCase().startsWith('es') && !v.lang.toLowerCase().includes('es-es')
      ) || voices.find(v => v.lang.toLowerCase().startsWith('es'));
    }

    if ('speechSynthesis' in window) {
      window.speechSynthesis.onvoiceschanged = setupLatinAudio;
      setupLatinAudio();
    }

    function speakCharm(text) {
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();

      const utter = new SpeechSynthesisUtterance(text);
      if (latinVoice) utter.voice = latinVoice;
      utter.lang = 'es-419';
      utter.rate = 1.05;
      utter.pitch = 1.15; // Tono ligeramente más amigable / compañero

      utter.onstart = () => charmBody.classList.add('speaking');
      utter.onend = () => charmBody.classList.remove('speaking');

      window.speechSynthesis.speak(utter);
    }

    /* INTERACCIÓN TÁCTIL CON EL CHARM */
    function pokeCharm() {
      haptic([30, 20, 40]);
      charmBody.classList.add('tapped');
      setTimeout(() => charmBody.classList.remove('tapped'), 200);

      const greetings = [
        "¡Hola! Aquí estoy en tu reloj.",
        "¿Qué tenemos pendiente para hoy?",
        "Tus metas de Notion están al día.",
        "Listo para cuando me ocupes."
      ];
      const pick = greetings[Math.floor(Math.random() * greetings.length)];
      dialogText.textContent = pick;
      speakCharm(pick);
    }

    /* HABLAR CON EL CHARM DIRECTO EN EL RELOJ */
    function listenCharmVoice() {
      haptic(50);
      if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
        const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
        const rec = new SpeechRec();
        rec.lang = 'es-419';

        rec.onstart = () => {
          statusLabel.textContent = "ESCUCHANDO...";
          dialogText.textContent = "Te escucho atentamente...";
          charmBody.classList.add('speaking');
        };

        rec.onresult = (e) => {
          charmBody.classList.remove('speaking');
          statusLabel.textContent = "MUSE CHARM";
          const query = e.results[0][0].transcript;
          dialogText.textContent = `"${query}"`;
          haptic([40, 40]);

          // Copia al portapapeles y ofrece entrar a la web
          if (navigator.clipboard) {
            navigator.clipboard.writeText(query).catch(()=>{});
          }
          speakCharm("Entendido. Abriendo tu chat.");
          setTimeout(() => { goToMuseWeb(); }, 800);
        };

        rec.onerror = () => {
          charmBody.classList.remove('speaking');
          statusLabel.textContent = "MUSE CHARM";
          dialogText.textContent = "No alcancé a oírte bien.";
        };

        rec.start();
      } else {
        goToMuseWeb();
      }
    }

    /* ABRIR DIRECTAMENTE TU SESIÓN LOGUEADA */
    function goToMuseWeb() {
      haptic(45);
      // Abre la web donde ya estás logueado en tu reloj
      window.location.href = "https://muse.ai";
    }
  </script>
</body>
</html>
