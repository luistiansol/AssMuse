<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Muse Agent Watch</title>
  <style>
    :root {
      --bg: #000000;
      --card: #141720;
      --card-border: #2a2f3d;
      --muse-cream: #ead8b8;
      --muse-cream-light: #f7efe0;
      --muse-blue: #1877f2;
      --text: #ffffff;
      --muted: #9aa4b5;
      --ok: #00e676;
    }

    body.light-muse {
      --bg: #f4efe6;
      --card: #ffffff;
      --card-border: #e2d9c8;
      --text: #1c1e21;
      --muted: #65676b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, sans-serif;
      padding: 10px 12px 60px 12px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      text-align: center;
    }

    .avatar-wrapper {
      position: relative;
      width: 58px;
      height: 58px;
      margin: 4px auto;
      cursor: pointer;
    }

    .avatar-circle {
      width: 58px;
      height: 58px;
      border-radius: 50%;
      background: radial-gradient(circle at 50% 35%, #f5f6f8 0%, #dcdfe4 100%);
      border: 2px solid var(--muse-cream);
      overflow: hidden;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.4);
    }

    .avatar-circle img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none;
    }

    .avatar-circle.custom-img svg { display: none; }
    .avatar-circle.custom-img img { display: block; }

    .muse-corner-badge {
      position: absolute;
      bottom: -2px;
      right: -2px;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: #ffffff;
      border: 1.5px solid #e4e6eb;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.3);
    }

    .muse-corner-badge span {
      font-family: Georgia, serif;
      font-style: italic;
      font-weight: 900;
      font-size: 0.88rem;
      color: var(--muse-blue);
      line-height: 1;
    }

    .title {
      font-size: 0.95rem;
      font-weight: 800;
      color: var(--text);
      margin-top: 2px;
    }

    .subtitle-hint {
      font-size: 0.58rem;
      color: var(--muted);
      margin-bottom: 6px;
    }

    .hw-bar {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 5px;
      width: 100%;
      margin-bottom: 8px;
    }

    .hw-btn {
      background: var(--card);
      border: 1px solid var(--card-border);
      color: var(--muted);
      border-radius: 12px;
      padding: 6px 4px;
      font-size: 0.62rem;
      font-weight: 700;
      cursor: pointer;
    }

    .hw-btn.active {
      border-color: var(--ok);
      color: var(--ok);
      background: rgba(0, 230, 118, 0.12);
    }

    .launch-main {
      width: 100%;
      background: linear-gradient(135deg, var(--muse-cream-light), var(--muse-cream));
      color: #1c1e21;
      border: 2px solid var(--muse-blue);
      border-radius: 18px;
      padding: 11px 8px;
      font-size: 0.82rem;
      font-weight: 900;
      box-shadow: 0 4px 12px rgba(24, 119, 242, 0.3);
      margin-bottom: 8px;
      cursor: pointer;
    }

    .launch-main:active { transform: scale(0.96); }

    .section-label {
      font-size: 0.62rem;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: var(--muted);
      margin: 4px 0;
      width: 100%;
      text-align: left;
      padding-left: 4px;
    }

    .prompt-grid {
      display: flex;
      flex-direction: column;
      gap: 6px;
      width: 100%;
      margin-bottom: 8px;
    }

    .prompt-btn {
      width: 100%;
      background: var(--card);
      border: 1px solid var(--card-border);
      border-left: 4px solid var(--muse-cream);
      color: var(--text);
      border-radius: 12px;
      padding: 9px 8px;
      font-size: 0.72rem;
      font-weight: 600;
      text-align: left;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
    }

    .prompt-btn:active { transform: scale(0.98); background: #1c2230; }

    .badge {
      font-size: 0.58rem;
      background: rgba(24, 119, 242, 0.18);
      color: var(--muse-blue);
      padding: 2px 5px;
      border-radius: 6px;
      font-weight: 800;
      white-space: nowrap;
    }

    .task-box {
      width: 100%;
      background: var(--card);
      border-radius: 12px;
      padding: 6px;
      border: 1px solid var(--card-border);
    }

    .task-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 4px;
      border-bottom: 1px solid var(--card-border);
      font-size: 0.7rem;
      cursor: pointer;
    }

    .task-item:last-child { border-bottom: none; }
    .task-item.done span { text-decoration: line-through; color: var(--muted); }

    .toast {
      position: fixed;
      bottom: 6%;
      left: 50%;
      transform: translateX(-50%);
      background: var(--muse-blue);
      color: #fff;
      font-weight: 800;
      font-size: 0.68rem;
      padding: 5px 10px;
      border-radius: 16px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
      z-index: 99;
      white-space: nowrap;
    }

    .toast.show { opacity: 1; }
  </style>
</head>
<body>

  <input type="file" id="avatarInput" accept="image/*" style="display:none" onchange="handleAvatarUpload(event)">

  <div class="avatar-wrapper" onclick="document.getElementById('avatarInput').click()">
    <div class="avatar-circle" id="avatarContainer">
      <img id="customAvatarImg" alt="Avatar">
      <svg viewBox="0 0 100 100" width="54" height="54" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <radialGradient id="furGrad" cx="42%" cy="32%" r="60%">
            <stop offset="0%" stop-color="#fbf3e4"/>
            <stop offset="55%" stop-color="#e7d4b5"/>
            <stop offset="100%" stop-color="#c5ab84"/>
          </radialGradient>
        </defs>
        <path d="M22,98 C18,68 25,22 50,22 C75,22 82,68 78,98 Z" fill="url(#furGrad)"/>
        <circle cx="44" cy="41" r="2.2" fill="#2b2623"/>
        <circle cx="56" cy="41" r="2.2" fill="#2b2623"/>
        <ellipse cx="50" cy="46.5" rx="2.5" ry="1.3" fill="#5c4938"/>
      </svg>
    </div>
    <div class="muse-corner-badge"><span>m</span></div>
  </div>

  <div class="title">Muse</div>
  <div class="subtitle-hint">accounts.meta.com</div>

  <div class="hw-bar">
    <button id="btnFull" class="hw-btn" onclick="toggleFull()">FULL</button>
    <button id="btnWake" class="hw-btn" onclick="toggleWake()">WAKE</button>
    <button id="btnTheme" class="hw-btn" onclick="toggleTheme()">TEMA</button>
  </div>

  <button class="launch-main" onclick="openMuseAgent()">
    ABRIR MI AGENTE MUSE
  </button>

  <div class="section-label">Comandos 1-Toque</div>

  <div class="prompt-grid">
    <button class="prompt-btn" onclick="copyAndLaunch('Estado actual de tareas y agentes en segundo plano para mi reloj.')">
      <span>Estado de tarea actual</span>
      <span class="badge">MUSE</span>
    </button>

    <button class="prompt-btn" onclick="copyAndLaunch('¿Tienes alguna acción o permiso esperando mi aprobación?')">
      <span>Aprobaciones pendientes</span>
      <span class="badge">OK</span>
    </button>

    <button class="prompt-btn" onclick="copyAndLaunch('Ya completé el paso actual. ¿Cuál es el siguiente paso en Goals?')">
      <span>Siguiente paso en Goals</span>
      <span class="badge">GO</span>
    </button>
  </div>

  <div class="section-label">Tareas del Reloj</div>
  <div class="task-box" id="taskList"></div>

  <div id="toast" class="toast">Copiado al portapapeles</div>

  <script>
    // Enlace directo al centro de cuentas de Meta / sesión activa de Muse
    const MUSE_LOGIN_URL = "https://accounts.meta.com/";
    let wakeLock = null;

    const defaultTasks = [
      { text: "Sesión vinculada con cuenta", done: true },
      { text: "Verificar estado en reloj", done: false },
      { text: "Revisar metas del día", done: false }
    ];

    function vibrate(ms = 40) {
      if (navigator.vibrate) navigator.vibrate(ms);
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 1600);
    }

    function handleAvatarUpload(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        localStorage.setItem('muse_custom_avatar', e.target.result);
        renderAvatar();
        vibrate(50);
        showToast('Avatar actualizado');
      };
      reader.readAsDataURL(file);
    }

    function renderAvatar() {
      const saved = localStorage.getItem('muse_custom_avatar');
      const container = document.getElementById('avatarContainer');
      const imgEl = document.getElementById('customAvatarImg');
      if (saved) {
        imgEl.src = saved;
        container.classList.add('custom-img');
      } else {
        container.classList.remove('custom-img');
      }
    }

    function toggleTheme() {
      vibrate(30);
      document.body.classList.toggle('light-muse');
      const isLight = document.body.classList.contains('light-muse');
      localStorage.setItem('muse_theme_light', isLight ? '1' : '0');
    }

    function loadTheme() {
      if (localStorage.getItem('muse_theme_light') === '1') {
        document.body.classList.add('light-muse');
      }
    }

    function toggleFull() {
      vibrate(30);
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        document.exitFullscreen();
      }
    }

    async function toggleWake() {
      vibrate(30);
      const btn = document.getElementById('btnWake');
      if ('wakeLock' in navigator) {
        if (!wakeLock) {
          try {
            wakeLock = await navigator.wakeLock.request('screen');
            btn.classList.add('active');
            showToast('Pantalla activa');
          } catch (e) {}
        } else {
          wakeLock.release();
          wakeLock = null;
          btn.classList.remove('active');
        }
      }
    }

    function openMuseAgent() {
      vibrate(50);
      window.location.href = MUSE_LOGIN_URL;
    }

    async function copyAndLaunch(promptText) {
      vibrate([30, 40, 30]);
      try {
        await navigator.clipboard.writeText(promptText);
        showToast('Copiado. Abriendo...');
      } catch (err) {}
      setTimeout(() => {
        window.location.href = MUSE_LOGIN_URL;
      }, 500);
    }

    function loadTasks() {
      const saved = JSON.parse(localStorage.getItem('muse_watch_tasks_v2')) || defaultTasks;
      const container = document.getElementById('taskList');
      container.innerHTML = '';
      saved.forEach((task, idx) => {
        const row = document.createElement('div');
        row.className = 'task-item' + (task.done ? ' done' : '');
        row.onclick = () => toggleTask(idx);
        row.innerHTML = `<span>${task.text}</span><strong>${task.done ? '✓' : '○'}</strong>`;
        container.appendChild(row);
      });
    }

    function toggleTask(index) {
      vibrate(25);
      const saved = JSON.parse(localStorage.getItem('muse_watch_tasks_v2')) || defaultTasks;
      saved[index].done = !saved[index].done;
      localStorage.setItem('muse_watch_tasks_v2', JSON.stringify(saved));
      loadTasks();
    }

    renderAvatar();
    loadTheme();
    loadTasks();
  </script>
</body>
</html>
